<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabine F. Cissé · Portfolio</title>
<meta name="description" content="Sabine F. Cissé, autrice et technologue créative. Un voyage au défilement à travers un manoir Dark Academia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: one fixed full-screen stage; the scroll drives a camera through five rooms of a dark academia home.
   Text lives in HTML in each room's empty side and fades out while the camera travels. */
:root {
  --ink: #0d0b09;
  --ink-soft: #1a1510;
  --cream: #ebe4d6;
  --cream-dim: #d9d0bf;
  --card-paper: #15110c;
  --card-ink: #d9ccb4;
  --gold: #c99a4b;
  --gold-deep: #a87230;
  --teal: #2e5c5a;
  --scrim: 13, 11, 9;
  --fog: 120, 104, 86;
  --display: 'Cinzel', 'Trajan Pro', Georgia, serif;
  --body: 'EB Garamond', Garamond, 'Times New Roman', serif;
  --mono: 'Courier Prime', 'Courier New', Courier, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
/* Light Academia: same journey, daylight version of the rooms */
html.is-light {
  --ink: #f8f1e4;
  --ink-soft: #efe5d2;
  --cream: #2b2117;
  --cream-dim: #33271a;
  --card-paper: #f4ecdc;
  --card-ink: #3a2c1d;
  --gold: #6a4510;
  --gold-deep: #8a5f1c;
  --scrim: 250, 244, 232;
  color-scheme: light;
}
html.is-light .fog { mix-blend-mode: normal; }
html.is-light .grain { opacity: .05; mix-blend-mode: multiply; }
html { background: var(--ink); }
body {
  background: var(--ink);
  color: var(--cream);
  font-family: var(--body);
  font-size: 19px;
  line-height: 1.6;
  padding-left: var(--gutter-l);
  padding-right: var(--gutter-r);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: var(--gold); text-underline-offset: 3px; }
a:hover { color: var(--cream); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ---------- Stage ---------- */
#track { width: 1px; }
#stage { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
.chapter { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; will-change: transform, opacity; }
.layer { position: absolute; inset: -3%; will-change: transform; }
.layer picture, .layer img { display: block; width: 100%; height: 100%; max-width: none; object-fit: cover; }

.veil { position: absolute; inset: 0; background: var(--ink); opacity: 0; pointer-events: none; }
.fog { position: absolute; inset: -20%; opacity: 0; pointer-events: none; background-size: 70% 100%; background-repeat: repeat-x; mix-blend-mode: screen; }
.fog-a { animation: drift 38s linear infinite; }
.fog-b { animation: drift 54s linear infinite reverse; background-size: 90% 120%; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-23%); } }
#dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 85% 75% at 50% 45%, transparent 55%, rgba(var(--scrim), .75) 100%); }
.grain { position: absolute; inset: -50%; pointer-events: none; opacity: .07; mix-blend-mode: overlay; animation: grain 1s steps(6) infinite; }
@keyframes grain { 0%{transform:translate(0,0)} 20%{transform:translate(-3%,2%)} 40%{transform:translate(2%,-3%)} 60%{transform:translate(-2%,-1%)} 80%{transform:translate(3%,3%)} 100%{transform:translate(0,0)} }

/* ---------- Text panels ---------- */
.panel-wrap {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 1.4rem;
  padding-block: 5.5rem 3.5rem;
  padding-left: calc(var(--gutter-l) + 4vw);
  padding-right: calc(var(--gutter-r) + 6.5rem);
}
.chapter[data-side="right"] .panel-wrap { align-items: flex-end; padding-right: calc(var(--gutter-r) + 7vw); }
.chapter[data-side="split"] .panel-wrap { flex-direction: row; justify-content: space-between; align-items: center; padding-right: calc(var(--gutter-r) + 5.5rem); }
.scrim { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(var(--scrim), .94) 0%, rgba(var(--scrim), .8) 34%, rgba(var(--scrim), 0) 64%); }
.chapter[data-side="right"] .scrim { background: linear-gradient(270deg, rgba(var(--scrim), .94) 0%, rgba(var(--scrim), .8) 34%, rgba(var(--scrim), 0) 64%); }
.chapter[data-side="split"] .scrim { background: linear-gradient(90deg, rgba(var(--scrim), .94) 0%, rgba(var(--scrim), .78) 24%, rgba(var(--scrim), 0) 42%, rgba(var(--scrim), 0) 58%, rgba(var(--scrim), .78) 76%, rgba(var(--scrim), .94) 100%); }
.panel { position: relative; isolation: isolate; width: min(32rem, 38vw); min-width: 0; display: flex; flex-direction: column; gap: 1rem; text-shadow: 0 0 2px rgba(var(--scrim), .9), 0 1px 16px rgba(var(--scrim), .95); }
.chapter[data-side="split"] .panel { width: min(27rem, 29vw); }
@media (min-width: 761px) and (min-aspect-ratio: 4/5) {
  #ch1[data-side="split"] .panel-wrap { padding-right: calc(var(--gutter-r) + 4.8rem); }
  #ch1[data-side="split"] .panel + .panel { width: min(25rem, 24vw); }
}
/* Soft backing so the text stays readable over bright parts of the painting */
.panel::before { content: ""; position: absolute; inset: -2.2rem -2.6rem; z-index: -1; pointer-events: none; filter: blur(10px);
  background: radial-gradient(closest-side, rgba(var(--scrim), .82), rgba(var(--scrim), .6) 62%, rgba(var(--scrim), 0)); }

.kicker { font-family: var(--mono); font-size: .8rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
.seal { display: inline-block; width: 3.4rem; height: 3.4rem; color: var(--gold); flex: none; }
.seal svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 6px rgba(var(--scrim), .9)); }
.seal .s-line { fill: none; stroke: currentColor; }
.seal .s-fill { fill: currentColor; }
.seal ellipse, .seal path { stroke-width: 1; }
.seal .s-num { font-family: var(--display); font-weight: 600; fill: currentColor; text-anchor: middle; dominant-baseline: central; letter-spacing: 0; }
h1, h2 { font-family: var(--display); font-weight: 400; line-height: 1.12; text-wrap: balance; color: var(--cream); margin: 0; }
h1 { font-size: clamp(2.6rem, 5.4vw, 4.6rem); letter-spacing: .01em; }
h2 { font-size: clamp(1.7rem, 3vw, 2.6rem); }
.roles { font-family: var(--display); font-weight: 600; font-size: clamp(.98rem, 1.35vw, 1.2rem); letter-spacing: .08em; text-transform: uppercase; color: var(--gold); line-height: 1.7; margin: 0; }
.tagline { font-style: italic; font-weight: 500; font-size: clamp(1.25rem, 1.9vw, 1.6rem); color: var(--cream); margin: 0; line-height: 1.4; }
.lede { margin: 0; color: var(--cream-dim); max-width: 34em; font-weight: 500; font-size: 1.14rem; line-height: 1.55; }
.hint { font-family: var(--mono); font-weight: 700; font-size: .9rem; letter-spacing: .12em; text-transform: uppercase; color: var(--cream); display: flex; align-items: center; gap: .8rem; margin-top: .6rem; }
.hint::before { content: ""; width: 1px; height: 2.4rem; background: linear-gradient(var(--gold), transparent); animation: fall 2.2s ease-in-out infinite; transform-origin: top; }
@keyframes fall { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

.groups { display: grid; gap: .9rem; margin: .2rem 0 0; }
.groups > div { display: grid; gap: .15rem; padding-left: .9rem; border-left: 1px solid rgba(201, 154, 75, .45); min-width: 0; }
.groups dt, .item-cat { font-family: var(--mono); font-weight: 700; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.groups dd { margin: 0; font-size: 1.06rem; font-weight: 500; line-height: 1.45; color: var(--cream-dim); }
.groups dd strong { color: var(--cream); font-weight: 500; }

.items { list-style: none; padding: 0; margin: .2rem 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.4rem; }
.items li { display: grid; gap: .15rem; align-content: start; min-width: 0; padding-top: .6rem; border-top: 1px solid rgba(201, 154, 75, .35); }
.item-name { font-family: var(--display); font-weight: 500; font-size: 1.12rem; color: var(--cream); line-height: 1.25; }
.item-sub { font-size: 1.04rem; font-style: italic; font-weight: 500; color: var(--cream-dim); line-height: 1.35; }
.items a { font-size: 1rem; font-weight: 500; }
.note { font-size: 1rem; font-weight: 500; color: var(--cream-dim); margin: 0; font-style: italic; }

.mailbox { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; padding: .9rem 1.1rem; border: 1px solid rgba(201, 154, 75, .5); background: rgba(var(--scrim), .55); }
.mail-addr { font-family: var(--mono); font-size: .95rem; color: var(--cream); user-select: all; overflow-wrap: anywhere; min-width: 0; }
.mail-actions { display: flex; gap: .6rem; }
.btn { font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; padding: .55rem .9rem; border: 1px solid var(--gold-deep); color: var(--gold); text-decoration: none; background: transparent; }
.btn:hover { background: var(--gold-deep); color: var(--ink); }
.foot { font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; color: var(--cream-dim); opacity: .8; margin: .4rem 0 0; }

/* ---------- Chrome ---------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; gap: 1rem;
  padding-top: calc(env(safe-area-inset-top, 0px) + .9rem); padding-bottom: .9rem;
  padding-left: calc(var(--gutter-l) + 1.2vw); padding-right: calc(var(--gutter-r) + 1.2vw);
  background: linear-gradient(rgba(var(--scrim), .85), rgba(var(--scrim), 0));
}
.brand { font-family: var(--display); font-size: .92rem; letter-spacing: .18em; text-transform: uppercase; color: var(--cream); white-space: nowrap; }
.where { font-family: var(--mono); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-right: auto; padding-left: 1rem; border-left: 1px solid rgba(201, 154, 75, .4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tools { display: flex; gap: .4rem; align-items: center; }
.tools button { font-family: var(--mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; padding: .35rem .55rem; color: var(--cream-dim); border: 1px solid transparent; }
.tools button[aria-pressed="true"] { color: var(--gold); border-color: rgba(201, 154, 75, .6); }
.lbl-short { display: none; }
.progress { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 21; background: var(--gold); transform-origin: left; transform: scaleX(0); }

.chapnav { position: fixed; z-index: 20; right: calc(env(safe-area-inset-right, 0px) + 1.3rem); top: 50%; transform: translateY(-50%); display: grid; gap: .6rem; justify-items: end; }
.chapnav button { display: flex; align-items: center; gap: .7rem; padding: .15rem 0; }
/* Tarot cards: one engraved plaque per room, the current one turns gold */
.card { --cb: var(--card-paper); --cl: var(--card-ink); display: block; width: 2.35rem; height: 3.76rem; overflow: visible; transition: transform .35s ease, filter .35s ease; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .35)); }
.card .c-bg { fill: var(--cb); stroke: var(--cl); stroke-width: 1.6; transition: fill .35s; }
.card .c-in { fill: none; stroke: var(--cl); stroke-width: .7; opacity: .85; }
.card .c-icon { fill: none; stroke: var(--cl); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.card .c-dot { fill: var(--cl); }
.card .c-num { font-family: var(--display); font-weight: 600; font-size: 11px; fill: var(--cl); text-anchor: middle; }
.chapnav button:hover .card, .chapnav button:focus-visible .card { transform: translateX(-3px) rotate(-2deg); }
.chapnav .lbl { font-family: var(--mono); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--cream); opacity: 0; transform: translateX(6px); transition: opacity .25s, transform .25s; white-space: nowrap; text-shadow: 0 1px 8px rgba(var(--scrim), 1); }
.chapnav button:hover .lbl, .chapnav button:focus-visible .lbl { opacity: 1; transform: none; }
.chapnav button[aria-current="true"] .card { --cb: var(--gold-deep); --cl: var(--ink); transform: translateX(-6px) scale(1.1); filter: drop-shadow(0 0 12px rgba(201, 154, 75, .55)); }
.stamp { position: fixed; z-index: 20; left: calc(var(--gutter-l) + 1.2vw); bottom: calc(env(safe-area-inset-bottom, 0px) + .9rem); font-family: var(--mono); font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--cream-dim); opacity: .55; }

/* ---------- Phones and portrait screens ---------- */
@media (max-width: 760px), (max-aspect-ratio: 4/5) {
  body { font-size: 16px; }
  .panel-wrap, .chapter[data-side="right"] .panel-wrap, .chapter[data-side="split"] .panel-wrap {
    flex-direction: column; justify-content: flex-end; align-items: stretch; gap: .9rem;
    padding-block: 4.5rem calc(env(safe-area-inset-bottom, 0px) + 2.6rem);
    padding-left: var(--gutter-l); padding-right: calc(var(--gutter-r) + 2.6rem);
  }
  .scrim, .chapter[data-side="right"] .scrim, .chapter[data-side="split"] .scrim { background: linear-gradient(0deg, rgba(var(--scrim), .96) 0%, rgba(var(--scrim), .86) 40%, rgba(var(--scrim), 0) 66%); }
  .panel, .chapter[data-side="split"] .panel { width: 100%; gap: .7rem; }
  .panel::before { display: none; }
  h1 { font-size: clamp(2.1rem, 10vw, 3rem); }
  .roles { font-size: .9rem; letter-spacing: .05em; }
  .hint { font-size: .78rem; }
  h2 { font-size: clamp(1.35rem, 6.2vw, 1.8rem); }
  .lede.long, .groups dd .extra, .item-sub, .note { display: none; }
  .items { grid-template-columns: 1fr 1fr; gap: .6rem .9rem; }
  .item-name { font-size: .92rem; }
  .groups { gap: .55rem; }
  .groups dd { font-size: .95rem; }
  .where { display: none; }
  .lbl-long { display: none; }
  .lbl-short { display: inline; }
  .topbar { justify-content: space-between; }
  .brand { font-size: .78rem; letter-spacing: .12em; }
  .chapnav { right: calc(env(safe-area-inset-right, 0px) + .5rem); gap: .4rem; }
  .card { width: 1.6rem; height: 2.56rem; }
  .seal { width: 2.8rem; height: 2.8rem; }
  .chapnav .lbl { display: none; }
  .stamp { display: none; }
  .mail-addr { font-size: .8rem; }
}

/* ---------- Short screens (phone held sideways, small laptop windows) ---------- */
@media (max-height: 620px) and (min-width: 761px) and (min-aspect-ratio: 4/5) {
  .panel-wrap, .chapter[data-side="right"] .panel-wrap, .chapter[data-side="split"] .panel-wrap { padding-block: 3.6rem 1rem; gap: .8rem; }
  .panel { gap: .5rem; }
  h1 { font-size: clamp(1.8rem, 7vh, 2.8rem); }
  h2 { font-size: clamp(1.25rem, 5vh, 1.8rem); }
  .roles { font-size: .85rem; }
  .tagline { font-size: 1.05rem; }
  .lede.long, .groups dd .extra, .item-sub, .note, .hint { display: none; }
  .groups { gap: .4rem; }
  .groups dd { font-size: .9rem; }
  .items { gap: .4rem 1rem; }
  .items li { padding-top: .3rem; }
  .seal { width: 2.4rem; height: 2.4rem; }
  .kicker { font-size: .7rem; }
  .card { width: 1.5rem; height: 2.4rem; }
  .chapnav { gap: .35rem; }
  .topbar { padding-top: calc(env(safe-area-inset-top, 0px) + .5rem); padding-bottom: .5rem; }
}

/* ---------- Reading mode without animation ---------- */
body.is-static #track, body.is-static .chapnav, body.is-static .progress,
body.is-static .fog, body.is-static .veil, body.is-static #dust, body.is-static .grain, body.is-static .scrim, body.is-static .hint, body.is-static .stamp { display: none !important; }
body.is-static #stage { position: relative; inset: auto; overflow: visible; padding-top: 4.5rem; }
body.is-static .vignette { display: none; }
body.is-static .chapter { position: relative; inset: auto; display: grid; gap: 0; margin-bottom: 3.5rem; }
body.is-static .scene { position: relative; inset: auto; height: min(62vh, 56vw); opacity: 1 !important; transform: none !important; filter: none !important; overflow: hidden; }
body.is-static .layer { inset: 0; transform: none !important; }
body.is-static .panel-wrap, body.is-static .chapter[data-side="right"] .panel-wrap { position: relative; inset: auto; display: block; padding: 2rem 0 0; opacity: 1 !important; visibility: visible !important; }
body.is-static .panel, body.is-static .chapter[data-side="split"] .panel { width: auto; max-width: 44rem; margin: 0 auto; transform: none !important; opacity: 1 !important; text-shadow: none; }
body.is-static .panel + .panel { margin-top: 1.4rem; }
body.is-static .panel::before { display: none; }
body.is-static .lede.long, body.is-static .groups dd .extra, body.is-static .item-sub, body.is-static .note { display: revert; }
body.is-static .items { grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); }

@media (prefers-reduced-motion: reduce) {
  .fog-a, .fog-b, .grain, .hint::before { animation: none; }
}
/* ---------- Contact letter (form) ---------- */
.letter { width: min(34rem, calc(100vw - 2rem)); max-height: calc(100dvh - 2rem); overflow: auto; padding: 2.2rem clamp(1.2rem, 4vw, 2.6rem) 1.8rem;
  background: var(--ink); color: var(--cream); font-family: var(--body); border: 1px solid var(--gold-deep);
  outline: 1px solid rgba(201, 154, 75, .35); outline-offset: -9px; box-shadow: 0 30px 80px rgba(0, 0, 0, .55); }
.letter::backdrop { background: rgba(var(--scrim), .8); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.letter[open] { display: flex; flex-direction: column; gap: .7rem; animation: letterIn .45s ease; }
@keyframes letterIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
.letter-seal { align-self: center; }
.letter h2 { text-align: center; font-size: clamp(1.5rem, 3vw, 2rem); }
.letter-sub { text-align: center; font-style: italic; font-weight: 500; font-size: 1.1rem; color: var(--cream-dim); margin: 0; }
.letter-form { display: grid; gap: .35rem; margin-top: .3rem; }
.letter label { font-family: var(--mono); font-weight: 700; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-top: .7rem; }
.letter input, .letter textarea { font: inherit; font-size: 1.08rem; font-weight: 500; color: var(--cream); background: transparent; border: 0; border-bottom: 1px solid rgba(201, 154, 75, .6); border-radius: 0; padding: .45rem .1rem; min-width: 0; }
.letter textarea { resize: vertical; min-height: 7.5rem; border: 1px solid rgba(201, 154, 75, .5); padding: .6rem .7rem; }
.letter input:focus, .letter textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 1px 0 var(--gold); }
.letter ::placeholder { color: var(--cream-dim); opacity: .6; }
.btn-send { margin-top: 1.2rem; justify-self: center; font-size: .82rem; font-weight: 700; padding: .85rem 1.7rem; cursor: pointer; }
.btn-send:disabled { opacity: .6; cursor: progress; }
.letter-status { min-height: 1.4em; text-align: center; margin: .3rem 0 0; font-weight: 500; }
.letter-note { text-align: center; font-size: .95rem; font-style: italic; color: var(--cream-dim); margin: 0; }
.letter-close { position: absolute; top: .5rem; right: .8rem; font-size: 2rem; line-height: 1; color: var(--gold); padding: .2rem .45rem; }
</style>
</head>
<body>

<div class="progress" id="progress"></div>

<header class="topbar">
  <span class="brand">Sabine F. Cissé</span>
  <span class="where" id="where" aria-live="polite"></span>
  <div class="tools">
    <button type="button" id="btn-fr" aria-pressed="true">FR</button>
    <button type="button" id="btn-en" aria-pressed="false">EN</button>
    <button type="button" id="btn-theme" aria-pressed="false" data-i18n="theme_btn">Light Academia</button>
    <button type="button" id="btn-static" aria-pressed="false" data-i18n="static_btn">Lire sans animation</button>
  </div>
</header>

<nav class="chapnav" id="chapnav" aria-label="Chapitres"></nav>

<main id="stage">
  <!-- I. Vestibule -->
  <section class="chapter" id="ch1" data-side="left" data-side-dark="left" data-side-light="split" data-focus-dark="84% 40%" data-focus-light="52% 30%" data-mfocus="50% 40%">
    <div class="scene"><div class="layer">
      <picture data-name="ch1"><source media="(max-width: 760px), (max-aspect-ratio: 4/5)" srcset="img/ch1-m.jpg"><img src="img/ch1.jpg" alt="Le vestibule : sol d'obsidienne, escalier au tapis rouge, portraits dorés ; à droite, le buste de marbre de Sabine F. Cissé dans un rai de lumière" fetchpriority="high"></picture>
    </div></div>
    <div class="panel-wrap"><div class="scrim"></div>
      <div class="panel">
        <p class="kicker"><span class="seal">I</span><span data-i18n="room_1"></span></p>
        <h1>Sabine F. Cissé</h1>
        <p class="roles" data-i18n="roles"></p>
        <p class="tagline" data-i18n="tagline"></p>

      }
      if (k === "theme_btn") {
        el.innerHTML = `<span class="lbl-long">${isLight ? d.theme_btn_on : d.theme_btn}</span><span class="lbl-short">${isLight ? d.theme_short_on : d.theme_short}</span>`;
        return;
      }
      if (d[k] != null) el.innerHTML = d[k];
    });
    document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = d[el.getAttribute("data-i18n-ph")]; });
    document.querySelectorAll("[data-i18n-label]").forEach(el => { el.setAttribute("aria-label", d[el.getAttribute("data-i18n-label")]); });
    nav.setAttribute("aria-label", d.nav);
    document.getElementById("btn-fr").setAttribute("aria-pressed", lang === "fr");
    document.getElementById("btn-en").setAttribute("aria-pressed", lang === "en");
    setActive(active, true);
  }

  function setActive(i, force) {
    if (i === active && !force) return;
    active = i;
    nav.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-current", j === i ? "true" : "false"));
    where.textContent = `${ROMAN[i]} · ${T[lang]["nav_" + (i + 1)]}`;
  }

  // ---------- Procedural textures: fog and grain ----------
  function fogTexture(rgb, alpha) {
    const c = document.createElement("canvas"); c.width = 512; c.height = 256;
    const g = c.getContext("2d");
    for (let k = 0; k < 140; k++) {
      const x = Math.random() * 512, y = 40 + Math.random() * 190, r = 30 + Math.random() * 90;
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      grd.addColorStop(0, `rgba(${rgb},${alpha})`);
      grd.addColorStop(1, `rgba(${rgb},0)`);
      g.fillStyle = grd;
      // draw wrapped so the tile repeats seamlessly
      for (const dx of [-512, 0, 512]) { g.beginPath(); g.arc(x + dx, y, r, 0, Math.PI * 2); g.fill(); }
    }
    return c.toDataURL();
  }
  function grainTexture() {
    const c = document.createElement("canvas"); c.width = c.height = 160;
    const g = c.getContext("2d"), img = g.createImageData(160, 160);
    for (let p = 0; p < img.data.length; p += 4) { const v = Math.random() * 255; img.data[p] = img.data[p + 1] = img.data[p + 2] = v; img.data[p + 3] = 255; }
    g.putImageData(img, 0, 0);
    return c.toDataURL();
  }
  const FOG = { dark: `url(${fogTexture("150,132,108", .16)})`, light: `url(${fogTexture("255,250,240", .3)})` };
  let dustRGB = "232, 200, 140";

  // Swap images, text sides and atmosphere between Dark and Light Academia
  function applyTheme() {
    const theme = isLight ? "light" : "dark";
    document.documentElement.classList.toggle("is-light", isLight);
    chapters.forEach(c => {
      c.dataset.side = c.dataset["side" + (isLight ? "Light" : "Dark")];
      c.dataset.focus = c.dataset["focus" + (isLight ? "Light" : "Dark")];
      const pic = c.querySelector("picture"), name = pic.dataset.name, suffix = isLight ? "-l" : "";
      pic.querySelector("source").srcset = `img/${name}${suffix}-m.jpg`;
      pic.querySelector("img").src = `img/${name}${suffix}.jpg`;
    });
    document.getElementById("fogA").style.backgroundImage = FOG[theme];
    document.getElementById("fogB").style.backgroundImage = FOG[theme];
    dustRGB = isLight ? "150, 108, 45" : "232, 200, 140";
    document.getElementById("btn-theme").setAttribute("aria-pressed", isLight);
  }
  const grainEl = document.getElementById("grain");
  grainEl.style.backgroundImage = `url(${grainTexture()})`;

  // ---------- Dust in the light: drifts, and streams past the camera when travelling ----------
  const dust = document.getElementById("dust");
  const dctx = dust.getContext("2d");
  let motes = [], W = 0, H = 0, speed = 0, rafId = 0;
  function sizeDust() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = dust.clientWidth; H = dust.clientHeight;
    dust.width = W * dpr; dust.height = H * dpr;
    dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = narrow() ? 45 : 85;
    motes = Array.from({ length: count }, () => ({ x: Math.random() * W, y: Math.random() * H, r: .4 + Math.random() * 1.6, vx: (Math.random() - .5) * .12, vy: -.05 - Math.random() * .15, a: .15 + Math.random() * .5, t: Math.random() * 6 }));
  }
  function drawDust() {
    dctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H * .45;
    speed *= .92;
    for (const m of motes) {
      m.t += .02;
      const push = speed * .018;
      m.x += m.vx + (m.x - cx) * push;
      m.y += m.vy + (m.y - cy) * push;
      if (m.x < -10 || m.x > W + 10 || m.y < -10 || m.y > H + 10) {
        m.x = cx + (Math.random() - .5) * W * .5; m.y = cy + (Math.random() - .5) * H * .5;
      }
      const alpha = m.a * (.6 + .4 * Math.sin(m.t));
      const grow = 1 + Math.min(speed, 3) * .5;
      dctx.fillStyle = `rgba(${dustRGB}, ${alpha})`;
      dctx.beginPath(); dctx.arc(m.x, m.y, m.r * grow, 0, Math.PI * 2); dctx.fill();
    }
    rafId = requestAnimationFrame(drawDust);
  }

  // ---------- Scroll-driven camera ----------
  gsap.registerPlugin(ScrollTrigger);
  ScrollTrigger.config({ ignoreMobileResize: true });
  const HOLD = 1.1, TRANS = 1.0, STEP = HOLD + TRANS;
  const TOTAL = N * HOLD + (N - 1) * TRANS;
  let tl = null;

  function build() {
    const track = document.getElementById("track");
    track.style.height = `${TOTAL * 100}vh`;
    const isNarrow = narrow();
    const useBlur = !isNarrow && !reduce;
    const scenes = chapters.map(c => c.querySelector(".scene"));
    const layers = chapters.map(c => c.querySelector(".layer"));
    const panels = chapters.map(c => c.querySelector(".panel-wrap"));
    const inners = chapters.map(c => Array.from(c.querySelectorAll(".panel")));

    chapters.forEach((c, i) => {
      gsap.set(scenes[i], { transformOrigin: isNarrow ? c.dataset.mfocus : c.dataset.focus, opacity: i === 0 ? 1 : 0, scale: 1, filter: useBlur ? "blur(0px)" : "none" });
      gsap.set(layers[i], { scale: 1, xPercent: 0, yPercent: 0 });
      gsap.set(panels[i], { autoAlpha: i === 0 ? 1 : 0 });
      gsap.set(inners[i], { y: 0 });
    });
    gsap.set(["#fogA", "#fogB", "#veil"], { opacity: 0 });

    tl = gsap.timeline({
      defaults: { ease: "none" },
      scrollTrigger: {
        trigger: track, start: "top top", end: "bottom bottom", scrub: reduce ? true : 0.9,
        onUpdate(self) {
          progress.style.transform = `scaleX(${self.progress})`;
          const t = self.progress * TOTAL;
          setActive(Math.min(N - 1, Math.floor((t + TRANS * .5) / STEP)));
          speed = Math.min(4, Math.abs(self.getVelocity()) / 900);
        }
      }
    });

    for (let i = 0; i < N; i++) {
      const t0 = i * STEP;
      const side = chapters[i].dataset.side;
      const dir = side === "left" ? 1 : side === "right" ? -1 : 0;
      // Hold: the camera settles and drifts gently toward the bust
      tl.to(layers[i], { scale: reduce ? 1 : 1.07, xPercent: reduce ? 0 : -dir * 1.2, yPercent: reduce ? 0 : -.6, duration: HOLD + (i < N - 1 ? TRANS : 0) }, t0);
      if (i === N - 1) break;
      const tt = t0 + HOLD;
      const next = i + 1;
      // Text leaves first
      tl.to(inners[i], { y: -24, duration: TRANS * .3 }, tt)
        .to(panels[i], { autoAlpha: 0, duration: TRANS * .3 }, tt);
      if (reduce) {
        tl.to(scenes[i], { opacity: 0, duration: TRANS * .5 }, tt + TRANS * .3)
          .to(scenes[next], { opacity: 1, duration: TRANS * .5 }, tt + TRANS * .3);
      } else {
        // Camera pushes into the room, through dust and dark, and the next room emerges
        tl.to(scenes[i], { scale: 1.7, duration: TRANS * .55, ease: "power1.in" }, tt)
          .to(scenes[i], { opacity: 0, duration: TRANS * .22 }, tt + TRANS * .3);
        if (useBlur) tl.to(scenes[i], { filter: "blur(7px)", duration: TRANS * .3 }, tt + TRANS * .2);
        tl.to("#veil", { opacity: isLight ? .4 : .85, duration: TRANS * .25 }, tt + TRANS * .22)
          .to("#veil", { opacity: 0, duration: TRANS * .35 }, tt + TRANS * .55)
          .to(["#fogA", "#fogB"], { opacity: isLight ? .75 : 1, duration: TRANS * .3 }, tt + TRANS * .12)
          .to(["#fogA", "#fogB"], { opacity: 0, duration: TRANS * .4 }, tt + TRANS * .56)
          .fromTo(scenes[next], { scale: 1.3, opacity: 0 }, { scale: 1, opacity: 1, duration: TRANS * .5, ease: "power2.out", immediateRender: false }, tt + TRANS * .48);
        if (useBlur) tl.fromTo(scenes[next], { filter: "blur(8px)" }, { filter: "blur(0px)", duration: TRANS * .42, immediateRender: false }, tt + TRANS * .5);
      }
      // Text of the next room arrives once the camera has settled
      tl.fromTo(panels[next], { autoAlpha: 0 }, { autoAlpha: 1, duration: TRANS * .25, immediateRender: false }, tt + TRANS * .75)
        .fromTo(inners[next], { y: 24 }, { y: 0, duration: TRANS * .25, immediateRender: false }, tt + TRANS * .75);
    }
  }

  function teardown() {
    if (tl) { tl.scrollTrigger && tl.scrollTrigger.kill(); tl.kill(); tl = null; }
    gsap.set(".scene, .layer, .panel-wrap, .panel, #fogA, #fogB, #veil", { clearProps: "all" });
  }

  function goTo(i) {
    if (isStatic || !tl) { chapters[i].scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }); return; }
    const st = tl.scrollTrigger;
    const t = i * STEP + HOLD * .15;
    const y = st.start + (st.end - st.start) * (t / TOTAL);
    window.scrollTo({ top: y, behavior: Math.abs(i - active) > 1 || reduce ? "auto" : "smooth" });
  }

  function setMode(staticOn) {
    isStatic = staticOn;
    store.set("manoir-static", staticOn ? "1" : "0");
    document.body.classList.toggle("is-static", staticOn);
    document.getElementById("btn-static").setAttribute("aria-pressed", staticOn);
    teardown();
    cancelAnimationFrame(rafId);
    window.scrollTo(0, 0);
    if (!staticOn) {
      build();
      if (!reduce) { sizeDust(); drawDust(); }
      ScrollTrigger.refresh();
    } else {
      chapters.forEach(c => c.querySelectorAll("img").forEach(im => im.loading = "eager"));
    }
    applyLang();
  }

  // ---------- Controls ----------
  document.getElementById("btn-fr").addEventListener("click", () => { lang = "fr"; store.set("manoir-lang", "fr"); applyLang(); });
  document.getElementById("btn-en").addEventListener("click", () => { lang = "en"; store.set("manoir-lang", "en"); applyLang(); });
  document.getElementById("btn-static").addEventListener("click", () => setMode(!isStatic));
  document.getElementById("btn-theme").addEventListener("click", () => {
    isLight = !isLight;
    store.set("manoir-theme", isLight ? "light" : "dark");
    const p = tl ? tl.scrollTrigger.progress : 0;
    applyTheme();
    if (!isStatic) {
      teardown(); build(); ScrollTrigger.refresh();
      const st = tl.scrollTrigger; window.scrollTo(0, st.start + (st.end - st.start) * p);
    }
    applyLang();
  });
  document.getElementById("btn-copy").addEventListener("click", e => {
    const btn = e.currentTarget, addr = document.getElementById("mail-addr").textContent.trim();
    const done = () => { btn.textContent = T[lang].copied; setTimeout(() => { btn.textContent = T[lang].copy; }, 1800); };
    const select = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("mail-addr")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(addr).then(done, select); else select();
  });
  document.addEventListener("keydown", e => {
    if (isStatic || letter.open || e.target.closest("input, textarea")) return;
    if (e.key === "PageDown" || e.key === "ArrowRight") { e.preventDefault(); goTo(Math.min(N - 1, active + 1)); }
    if (e.key === "PageUp" || e.key === "ArrowLeft") { e.preventDefault(); goTo(Math.max(0, active - 1)); }
  });
  let lastNarrow = narrow();
  window.addEventListener("resize", () => {
    if (isStatic) return;
    sizeDust();
    if (narrow() !== lastNarrow) { lastNarrow = narrow(); const p = tl ? tl.scrollTrigger.progress : 0; teardown(); build(); ScrollTrigger.refresh(); const st = tl.scrollTrigger; window.scrollTo(0, st.start + (st.end - st.start) * p); }
  });
  // Preload the other rooms once the first one is shown
  window.addEventListener("load", () => { chapters.forEach(c => c.querySelectorAll("img").forEach(im => { im.loading = "eager"; })); });


  // ---------- Contact letter: sends through Formspree, same inbox as before ----------
  const letter = document.getElementById("letter");
  const cform = document.getElementById("contact-form");
  const sendBtn = document.getElementById("f-send"), fstatus = document.getElementById("f-status");
  document.getElementById("btn-write").addEventListener("click", () => { fstatus.textContent = ""; letter.showModal(); });
  document.getElementById("letter-close").addEventListener("click", () => letter.close());
  letter.addEventListener("click", e => {
    if (e.target !== letter) return;
    const r = letter.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) letter.close();
  });
  cform.addEventListener("submit", e => {
    e.preventDefault();
    const d = T[lang];
    sendBtn.disabled = true; sendBtn.textContent = d.form_sending; fstatus.textContent = "";
    fetch(cform.action, { method: "POST", body: new FormData(cform), headers: { Accept: "application/json" } })
      .then(r => {
        if (!r.ok) throw new Error("send failed");
        cform.reset();
        fstatus.textContent = d.form_ok;
        setTimeout(() => { if (letter.open) letter.close(); }, 2600);
      })
      .catch(() => { fstatus.textContent = d.form_err; })
      .finally(() => { sendBtn.disabled = false; sendBtn.textContent = T[lang].form_send; });
  });

  applyTheme();
  setMode(isStatic);
})();
</script>
</body>
</html>
